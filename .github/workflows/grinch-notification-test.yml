name: Grinch Breakfast Notification Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Grinch Breakfast Booking
        env:
          NTFY_TOPIC: ${{ secrets.GRINCH_NTFY_TOPIC }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request

          topic = os.environ.get("NTFY_TOPIC", "").strip()

          if not topic:
              raise RuntimeError("GRINCH_NTFY_TOPIC is missing!")

          # Simulated announcement
          announcement = """
          Grinch Breakfast 2026
          December reservations are now available.
          Book now!
          """

          # Test the booking detection
          breakfast = "grinch breakfast" in announcement.lower()
          year = "2026" in announcement
          booking = "book now" in announcement.lower()

          print("Breakfast detected:", breakfast)
          print("Year detected:", year)
          print("Booking detected:", booking)

          if breakfast and year and booking:
              message = (
                  "TEST ONLY: Simulated Grinch Breakfast "
                  "2026 booking announcement. "
                  "Your notification system is working! "
                  "Tickets have NOT been confirmed available."
              )

              request = urllib.request.Request(
                  f"https://ntfy.sh/{topic}",
                  data=message.encode("utf-8"),
                  headers={
                      "Title": "GRINCH BREAKFAST TEST",
                      "Priority": "high",
                      "Tags": "christmas_tree"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  print("Notification sent:", response.status)
          else:
              raise RuntimeError("Detection test failed!")

          print("TEST COMPLETE!")
          PY