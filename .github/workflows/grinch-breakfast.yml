name: Grinch Breakfast Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: grinch-breakfast-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Universal Grinch Breakfast
        env:
          NTFY_TOPIC: ${{ secrets.GRINCH_NTFY_TOPIC }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          import urllib.parse
          from html import unescape
          from html.parser import HTMLParser
          from pathlib import Path
          from datetime import datetime, timezone

          SOURCES = [
              "https://www.universalorlando.com/web/en/us/holidays/tickets",
              "https://www.universalorlando.com/web/en/us/things-to-do/events/holidays-at-universal",
              "https://www.universalorlando.com/web/en/us/plan-your-visit/dining-experiences/reservations",
              "https://blog.discoveruniversal.com/events/guide-to-the-holidays-at-universal-orlando-resort/"
          ]

          STATE_FILE = Path("grinch-breakfast-state.json")
          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          if not TOPIC:
              raise RuntimeError("GRINCH_NTFY_TOPIC is missing.")

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.text = []
                  self.links = []
                  self.skip = 0
                  self.current_href = None
                  self.link_text = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)

                  if tag in ("script", "style"):
                      self.skip += 1

                  if tag == "a":
                      self.current_href = attrs.get("href")
                      self.link_text = []

              def handle_endtag(self, tag):
                  if tag in ("script", "style"):
                      self.skip = max(0, self.skip - 1)

                  if tag == "a" and self.current_href:
                      self.links.append((
                          " ".join(self.link_text),
                          self.current_href
                      ))
                      self.current_href = None
                      self.link_text = []

              def handle_data(self, data):
                  if not self.skip:
                      self.text.append(data)

                      if self.current_href:
                          self.link_text.append(data)

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "text/html"
                  }
              )

              with urllib.request.urlopen(
                  request, timeout=30
              ) as response:
                  return response.read().decode(
                      "utf-8", errors="replace"
                  )

          def normalize(text):
              return re.sub(
                  r"\s+", " ", unescape(text)
              ).strip()

          def breakfast_match(text):
              return bool(re.search(
                  r"grinch.{0,90}breakfast|"
                  r"breakfast.{0,90}grinch",
                  text,
                  re.I
              ))

          def booking_match(text):
              return bool(re.search(
                  r"book now|reserve now|"
                  r"purchase tickets|buy tickets|"
                  r"book breakfast|"
                  r"reserve breakfast|"
                  r"select date|"
                  r"get tickets",
                  text,
                  re.I
              ))

          def fingerprint(value):
              return hashlib.sha256(
                  value.encode("utf-8")
              ).hexdigest()

          def notify(title, message, priority="high"):
              request = urllib.request.Request(
                  "https://ntfy.sh/" +
                  urllib.parse.quote(TOPIC, safe=""),
                  data=message.encode("utf-8"),
                  headers={
                      "Title": title,
                      "Priority": priority,
                      "Tags": "christmas_tree"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(
                  request, timeout=20
              ) as response:
                  print("Notification:", response.status)

          def inspect_page(url):
              parser = PageParser()
              parser.feed(fetch(url))

              text = normalize(" ".join(parser.text))
              announcements = []
              booking_links = []

              for match in re.finditer(
                  r"grinch.{0,90}breakfast|"
                  r"breakfast.{0,90}grinch",
                  text,
                  re.I
              ):
                  start = max(0, match.start() - 100)
                  end = min(len(text), match.end() + 180)
                  context = text[start:end]

                  if re.search(
                      r"2026|2027|coming|"
                      r"returning|reservations|"
                      r"tickets|available|"
                      r"holiday",
                      context,
                      re.I
                  ):
                      announcements.append(
                          normalize(context)
                      )

              for label, href in parser.links:
                  label = normalize(label)
                  full_url = urllib.parse.urljoin(url, href)

                  if not full_url.startswith(
                      ("https://", "http://")
                  ):
                      continue

                  combined = label + " " + full_url

                  if breakfast_match(combined):
                      if booking_match(combined):
                          booking_links.append(full_url)

              return {
                  "url": url,
                  "announcements": announcements,
                  "booking_links": booking_links
              }

          if STATE_FILE.exists():
              state = json.loads(STATE_FILE.read_text())
          else:
              state = {}

          if not isinstance(state, dict):
              raise RuntimeError("Invalid state file.")

          initialized = state.get(
              "grinch_v3_initialized", False
          )

          seen_announcements = set(
              state.get("grinch_v3_announcements", [])
          )

          seen_links = set(
              state.get("grinch_v3_booking_links", [])
          )

          new_announcements = []
          new_links = []
          successful = 0

          for url in SOURCES:
              try:
                  result = inspect_page(url)
                  successful += 1

                  print("Checked:", url)
                  print(
                      "Announcement matches:",
                      len(result["announcements"])
                  )
                  print(
                      "Booking links:",
                      len(result["booking_links"])
                  )

                  for announcement in result["announcements"]:
                      key = fingerprint(
                          url + "|" + announcement.lower()
                      )

                      if key not in seen_announcements:
                          seen_announcements.add(key)

                          if initialized:
                              new_announcements.append(url)

                  for link in result["booking_links"]:
                      key = fingerprint(link)

                      if key not in seen_links:
                          seen_links.add(key)

                          if initialized:
                              new_links.append(link)

              except Exception as error:
                  print("ERROR:", url, error)

          if successful == 0:
              raise RuntimeError(
                  "All Universal checks failed."
              )

          if new_announcements:
              notify(
                  "GRINCH BREAKFAST UPDATE!",
                  "New Grinch Breakfast information "
                  "was detected. Review Universal:\n" +
                  "\n".join(sorted(set(new_announcements)))
              )

          if new_links:
              notify(
                  "GRINCH BREAKFAST BOOKING LINK!",
                  "A new booking-related link "
                  "associated with Grinch Breakfast "
                  "was detected. Availability is "
                  "NOT yet confirmed:\n" +
                  "\n".join(sorted(set(new_links))),
                  "urgent"
              )

          state["grinch_v3_initialized"] = True

          state["grinch_v3_announcements"] = sorted(
              seen_announcements
          )

          state["grinch_v3_booking_links"] = sorted(
              seen_links
          )

          state["grinch_v3_last_check"] = (
              datetime.now(timezone.utc).isoformat()
          )

          STATE_FILE.write_text(
              json.dumps(state, indent=2)
          )

          print("Monitoring complete.")
          print("Successful sources:", successful)
          print("New announcements:", len(new_announcements))
          print("New booking links:", len(new_links))
          PY

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add grinch-breakfast-state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Grinch monitoring state"
            git push
          fi