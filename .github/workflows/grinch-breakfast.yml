name: Grinch Breakfast Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: grinch-breakfast-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Grinch Breakfast
        env:
          NTFY_TOPIC: ${{ secrets.GRINCH_NTFY_TOPIC }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import hashlib
          import urllib.request
          from pathlib import Path
          from html import unescape

          URLS = [
              "https://www.universalorlando.com/web/en/us/things-to-do/events/holidays-at-universal",
              "https://www.universalorlando.com/web/en/us/plan-your-visit/dining-experiences/reservations",
              "https://blog.discoveruniversal.com/events/guide-to-the-holidays-at-universal-orlando-resort/"
          ]

          STATE_FILE = Path("grinch-breakfast-state.json")
          TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          if not TOPIC:
              raise RuntimeError("GRINCH_NTFY_TOPIC is missing.")

          def notify(title, message, priority="high"):
              req = urllib.request.Request(
                  f"https://ntfy.sh/{TOPIC}",
                  data=message.encode("utf-8"),
                  headers={
                      "Title": title,
                      "Priority": priority,
                      "Tags": "christmas_tree"
                  },
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=20):
                  pass

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode(
                      "utf-8", errors="ignore"
                  )

          def clean(html):
              html = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  html,
                  flags=re.I | re.S
              )
              html = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  html,
                  flags=re.I | re.S
              )
              html = re.sub(r"<[^>]+>", " ", html)
              return re.sub(r"\s+", " ", unescape(html))

          def check_page(url):
              text = clean(fetch(url))

              breakfast_pattern = (
                  r"grinch.{0,60}breakfast|"
                  r"breakfast.{0,60}grinch"
              )

              contexts = []

              for match in re.finditer(
                  breakfast_pattern, text, re.I
              ):
                  start = max(0, match.start() - 180)
                  end = min(len(text), match.end() + 220)
                  contexts.append(text[start:end])

              announcement_contexts = []
              booking_contexts = []

              for context in contexts:
                  if not re.search(r"\b2026\b", context):
                      continue

                  if re.search(
                      r"announc|return|coming|"
                      r"holiday|available|experience",
                      context,
                      re.I
                  ):
                      announcement_contexts.append(context)

                  if re.search(
                      r"book now|reserve now|"
                      r"book your|reserve your|"
                      r"purchase tickets|"
                      r"buy tickets|"
                      r"make a reservation",
                      context,
                      re.I
                  ):
                      booking_contexts.append(context)

              return {
                  "url": url,
                  "announcement": announcement_contexts,
                  "booking": booking_contexts
              }

          if STATE_FILE.exists():
              try:
                  state = json.loads(STATE_FILE.read_text())
              except (ValueError, OSError):
                  raise RuntimeError(
                      "Monitoring state is invalid. "
                      "Fix it before continuing."
                  )
          else:
              state = {}

          if not isinstance(state, dict):
              raise RuntimeError("Invalid monitoring state.")

          state.setdefault("announcement_hashes", [])
          state.setdefault("booking_hashes", [])

          results = []

          for url in URLS:
              try:
                  result = check_page(url)
                  results.append(result)
                  print("Checked:", url)
                  print(
                      "Announcement matches:",
                      len(result["announcement"])
                  )
                  print(
                      "Booking matches:",
                      len(result["booking"])
                  )
              except Exception as error:
                  print("ERROR checking:", url, error)

          if not results:
              raise RuntimeError("All Universal pages failed.")

          def fingerprint(url, context):
              normalized = re.sub(
                  r"\s+", " ", context.lower()
              ).strip()

              return hashlib.sha256(
                  (url + "|" + normalized).encode()
              ).hexdigest()

          first_run = (
              "announcement_hashes" not in
              json.loads(STATE_FILE.read_text())
              if STATE_FILE.exists()
              else True
          )

          new_announcements = []
          new_booking_signals = []

          for result in results:
              for context in result["announcement"]:
                  key = fingerprint(result["url"], context)

                  if key not in state["announcement_hashes"]:
                      if not first_run:
                          new_announcements.append(
                              result["url"]
                          )
                      state["announcement_hashes"].append(key)

              for context in result["booking"]:
                  key = fingerprint(result["url"], context)

                  if key not in state["booking_hashes"]:
                      if not first_run:
                          new_booking_signals.append(
                              result["url"]
                          )
                      state["booking_hashes"].append(key)

          if new_announcements:
              notify(
                  "GRINCH BREAKFAST 2026 UPDATE!",
                  "New Grinch Breakfast 2026 wording "
                  "was detected on Universal's website. "
                  "Review the official information:\n"
                  + "\n".join(sorted(set(new_announcements)))
              )

          if new_booking_signals:
              notify(
                  "GRINCH BREAKFAST BOOKING SIGNAL!",
                  "New booking-related wording was "
                  "detected near Grinch Breakfast 2026. "
                  "This does not confirm availability. "
                  "Check Universal immediately:\n"
                  + "\n".join(sorted(set(new_booking_signals))),
                  "urgent"
              )

          STATE_FILE.write_text(
              json.dumps(state, indent=2)
          )

          print("Monitoring complete.")
          PY

      - name: Save monitoring state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add grinch-breakfast-state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Grinch monitoring state"
            git push
          fi